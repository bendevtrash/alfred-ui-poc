<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">Maison Alfred en coupe</title><desc id="desc">Cinq niveaux: combles, deuxième étage, premier étage, rez-de-chaussée et sous-sol.</desc>
<defs><style>.o{fill:#fbf8f1;stroke:#566b54;stroke-width:3}.w{stroke:#8b9588;stroke-width:2;fill:none}.f{fill:#e6ece2;stroke:#71846b;stroke-width:2}.t{font:700 16px Inter,Arial,sans-serif;fill:#273128}.s{font:500 13px Inter,Arial,sans-serif;fill:#697168}.l{font:800 17px Inter,Arial,sans-serif;fill:#53664f}.temp{font:600 13px Inter,Arial,sans-serif;fill:#7c837b}.sage{fill:#dfe8dc}.wood{fill:#c8b99f;stroke:#8f826f;stroke-width:1.5}.dark{stroke:#53664f;stroke-width:3;fill:none}.thin{stroke:#9ca49a;stroke-width:1.5;fill:none}</style></defs>
<rect width="1000" height="720" fill="none"/>
<!-- roof / attic -->
<path class="o" d="M120 170 L500 35 L880 170 L835 170 L500 55 L165 170 Z"/>
<line class="w" x1="165" y1="170" x2="835" y2="170"/>
<rect x="472" y="88" width="56" height="54" rx="4" class="f"/><line class="w" x1="500" y1="88" x2="500" y2="142"/><line class="w" x1="472" y1="115" x2="528" y2="115"/>
<text x="145" y="105" class="l">Combles</text><text x="145" y="127" class="temp">19,1°</text><text x="500" y="152" class="s" text-anchor="middle">Pièce unique · vide</text>
